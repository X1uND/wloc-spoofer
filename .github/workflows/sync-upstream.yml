name: Sync upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout Fork
      # ==========================================
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==========================================
      # 同步 upstream
      # ==========================================
      - name: Sync upstream branches
        shell: bash
        run: |
          set -e

          git remote remove upstream 2>/dev/null || true

          git remote add upstream \
            https://github.com/Yu9191/wloc.git

          git fetch origin --prune
          git fetch upstream --prune

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ==========================================================
          # 同步 main
          #
          # upstream/main
          #      ↓
          # origin/main
          #
          # 如果上游删除 main：
          # 保留你自己的 main，不报错。
          # ==========================================================
          echo "=== Check upstream main ==="

          if git show-ref --verify --quiet "refs/remotes/upstream/main"; then

            echo "=== Sync main ==="

            rm -rf /tmp/main-backup
            mkdir -p /tmp/main-backup

            # ------------------------------------------
            # 备份本 Fork 的 Workflow
            # ------------------------------------------
            if git cat-file -e origin/main:.github/workflows 2>/dev/null; then

              git archive \
                origin/main \
                .github/workflows \
                | tar -x -C /tmp/main-backup

              echo "Workflow backup completed."

            else
              echo "No .github/workflows found on origin/main."
            fi

            # ------------------------------------------
            # 备份 heartbeat
            # ------------------------------------------
            if git cat-file -e origin/main:.github/sync-heartbeat 2>/dev/null; then

              mkdir -p /tmp/main-backup/.github

              git show \
                origin/main:.github/sync-heartbeat \
                > /tmp/main-backup/.github/sync-heartbeat

              echo "Heartbeat backup completed."

            else
              echo "No existing heartbeat found."
            fi

            # ------------------------------------------
            # 同步 main
            # ------------------------------------------
            git checkout -B main upstream/main

            # ------------------------------------------
            # 恢复本 Fork 的 Workflow
            # ------------------------------------------
            if [ -d "/tmp/main-backup/.github/workflows" ]; then

              mkdir -p .github

              rm -rf .github/workflows

              cp -R \
                /tmp/main-backup/.github/workflows \
                .github/

              echo "Workflow restore completed."

            else
              echo "No workflow backup to restore."
            fi

            # ------------------------------------------
            # 恢复 heartbeat
            # ------------------------------------------
            if [ -f "/tmp/main-backup/.github/sync-heartbeat" ]; then

              mkdir -p .github

              cp \
                /tmp/main-backup/.github/sync-heartbeat \
                .github/sync-heartbeat

              echo "Heartbeat restore completed."

            else
              echo "No heartbeat backup to restore."
            fi

            # ------------------------------------------
            # 提交本 Fork 保留内容
            # ------------------------------------------
            git add -A

            if git diff --cached --quiet; then

              echo "No changes to main."

            else

              git commit \
                -m "Sync main from upstream/main and preserve workflows"

            fi

            git push origin main --force

          else

            echo "Upstream main does not exist."
            echo "Skipping main sync."

            # 保留你自己的 main
            git checkout -B main origin/main

          fi

          # ==========================================================
          # 同步 geo
          #
          # upstream/geo
          #      ↓
          # origin/geo
          #
          # 如果上游删除 geo：
          # 保留你自己的 geo，不报错。
          # ==========================================================
          echo ""
          echo "=== Check upstream geo ==="

          if git show-ref --verify --quiet "refs/remotes/upstream/geo"; then

            echo "=== Sync geo ==="

            git checkout -B geo upstream/geo

            git push origin geo --force

          else

            echo "Upstream geo does not exist."
            echo "Skipping geo sync."

          fi

          # ==========================================================
          # 40 天维护仓库活动
          #
          # heartbeat：
          # .github/sync-heartbeat
          #
          # 只维护 main。
          # ==========================================================
          echo ""
          echo "=== Check 40-day repository activity ==="

          git checkout main

          HEARTBEAT_FILE=".github/sync-heartbeat"

          mkdir -p .github

          # ------------------------------------------
          # 读取上一次 heartbeat
          # ------------------------------------------
          if [ -f "$HEARTBEAT_FILE" ]; then

            LAST_HEARTBEAT=$(cat "$HEARTBEAT_FILE")

            LAST_HEARTBEAT_TS=$(
              date -d "$LAST_HEARTBEAT" +%s 2>/dev/null || echo 0
            )

          else

            LAST_HEARTBEAT_TS=0

          fi

          NOW_TS=$(date +%s)

          # ------------------------------------------
          # 计算距离上次 heartbeat 的天数
          # ------------------------------------------
          if [ "$LAST_HEARTBEAT_TS" -eq 0 ]; then

            DAYS=999

          else

            DAYS=$(( (NOW_TS - LAST_HEARTBEAT_TS) / 86400 ))

          fi

          echo "Days since last heartbeat: ${DAYS}"

          # ------------------------------------------
          # 达到 40 天
          # ------------------------------------------
          if [ "$DAYS" -ge 40 ]; then

            NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            echo "Creating heartbeat: ${NOW_UTC}"

            printf '%s\n' "$NOW_UTC" > "$HEARTBEAT_FILE"

            git add "$HEARTBEAT_FILE"

            git commit \
              -m "chore: keep repository active"

            git push origin main

            echo "Heartbeat commit completed."

          else

            echo "No heartbeat required."

          fi

          echo ""
          echo "=== Sync completed ==="

      # ==========================================
      # 最终检查
      # ==========================================
      - name: Verify branches
        shell: bash
        run: |
          echo "=== Origin branches ==="
          git ls-remote --heads origin

          echo ""
          echo "=== Upstream branches ==="
          git ls-remote --heads upstream

          echo ""
          echo "=== Sync completed successfully ==="
